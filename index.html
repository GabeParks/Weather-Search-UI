<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather API Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Weather Search UI</h1>
    <p>Search for a city to get the upcoming hourly temperature forecast.</p>

    <div class="search-area">
      <input type="text" id="searchInput" placeholder="Enter a city name (e.g., Chicago)..." />
      <button id="searchBtn">Search</button>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
